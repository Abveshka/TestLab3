# Название пайплайна, отображается во вкладке Actions
name: CI

# Когда запускать пайплайн
on:
  # при каждом push в ветку main
  push:
    branches: [main]
  # при каждом pull request, направленном в ветку main
  pull_request:
    branches: [main]

jobs:
  test:
    # Виртуальная машина, на которой выполняются шаги
    runs-on: ubuntu-latest

    # Матрица: задача запускается отдельно для каждой версии Python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Шаг 1. Скачиваем код репозитория на виртуальную машину
      - name: Получить код
        uses: actions/checkout@v4

      # Шаг 2. Разворачиваем нужную версию Python
      # cache: pip включает кэширование зависимостей: пакеты скачиваются
      # один раз и повторно используются, пока не изменится requirements.txt
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Шаг 3. Устанавливаем пакеты из requirements.txt
      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Шаг 4. Проверка стиля кода (линтер)
      - name: Линтер (flake8)
        run: flake8 src tests --max-line-length=100

      # Шаг 5. Запуск тестов под управлением coverage:
      # coverage run запускает pytest и записывает, какие строки кода из src были выполнены
      - name: Запуск тестов с замером покрытия
        run: coverage run --source=src -m pytest

      # Шаг 6. Проверка порога покрытия:
      # если покрытие ниже 80%, команда завершается с ошибкой и пайплайн падает
      # -m показывает номера строк, не покрытых тестами
      - name: Проверка покрытия (минимум 80%)
        run: coverage report -m --fail-under=80